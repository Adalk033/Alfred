name: Build and Release Alfred (CPU)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ej: 0.2.1)'
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '9.0.x'

jobs:

  # ============================================================
  # Job 1: Compilar backend C++ sin CUDA (Windows)
  # ============================================================
  build-backend-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          submodules: recursive

      - name: Configurar CMake (Release, CPU-only)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DALFRED_CUDA=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Copiar runtime de Visual C++ al output
        shell: pwsh
        run: |
          $dest = "build/Release"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "No se encontro vswhere para localizar el runtime de Visual C++"
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) {
            throw "No se encontro una instalacion de Visual C++"
          }

          $crtDir = Get-ChildItem `
            -Path "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" `
            -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crtDir) {
            throw "No se encontro el runtime x64 de Visual C++"
          }

          Copy-Item -Path "$($crtDir.FullName)\*.dll" -Destination $dest -Force

      - name: Copiar DLLs de OpenSSL al output
        shell: pwsh
        run: |
          $dest = "build/Release"
          $searchRoots = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64",
            "C:\OpenSSL-Win64",
            "C:\ProgramData\chocolatey\lib\openssl\tools\OpenSSL"
          )
          $patterns = @("libcrypto*.dll", "libssl*.dll")
          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($pat in $patterns) {
              Get-ChildItem -Path $root -Filter $pat -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "Copiando $($_.FullName) -> $dest"
                  Copy-Item $_.FullName -Destination $dest -Force
                }
            }
            break
          }

      - name: Subir artifact del backend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alfred-backend-cpu
          path: |
            build/Release/alfred.exe
            build/Release/*.dll
          if-no-files-found: error

  # ============================================================
  # Job 2: Compilar frontend WinUI 3 (Windows)
  # ============================================================
  build-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Restaurar workloads necesarios
        run: dotnet workload restore --project ui/Alfred.UI/Alfred.UI.csproj

      - name: Restaurar dependencias NuGet
        run: dotnet restore ui/Alfred.UI/Alfred.UI.csproj

      - name: Compilar UI (self-contained)
        run: |
          msbuild ui/Alfred.UI/Alfred.UI.csproj `
            /restore `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true

      - name: Copiar output completo
        run: |
          $src = "ui/Alfred.UI/bin/x64/Release/net9.0-windows10.0.19041.0/win-x64"
          New-Item -ItemType Directory -Path publish/Alfred.UI -Force
          Copy-Item -Path "$src/*" -Destination publish/Alfred.UI/ -Recurse -Force

      - name: Subir artifact del frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: alfred-frontend-cpu
          path: publish/Alfred.UI/
          if-no-files-found: error

  # ============================================================
  # Job 3: Empaquetar y adjuntar a la Release existente
  # ============================================================
  package-release:
    runs-on: windows-latest
    needs: [build-backend-cpu, build-frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Obtener version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
          } else {
            $tag = "${{ github.ref_name }}"
            echo "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_ENV
          }

      - name: Descargar artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artifacts/

      - name: Crear estructura de distribucion
        run: |
          $dist = "Alfred-v${{ env.VERSION }}-cpu"
          New-Item -ItemType Directory -Path $dist
          Copy-Item -Path "artifacts/alfred-backend-cpu/*" -Destination $dist -Recurse
          Copy-Item -Path "artifacts/alfred-frontend-cpu/*" -Destination $dist -Recurse
          @"
          Alfred v${{ env.VERSION }} (CPU)
          ================================
          Asistente de IA local para Windows — variante sin CUDA.

          Requisitos:
          - Windows 10 (19041) o superior
          - No requiere GPU NVIDIA
          - El rendimiento dependera de tu CPU (recomendado 8+ nucleos)

          Uso:
          1. Ejecutar Alfred.UI.exe
          2. Ir a Modelos y descargar un modelo GGUF de HuggingFace
          3. Seleccionar el modelo y empezar a chatear

          Los datos se guardan en: %APPDATA%\Alfred\
          "@ | Out-File "$dist\LEEME.txt" -Encoding UTF8

      - name: Comprimir ZIP (portable)
        run: Compress-Archive -Path "Alfred-v${{ env.VERSION }}-cpu" -DestinationPath "Alfred-v${{ env.VERSION }}-win-x64-cpu.zip"

      - name: Crear instalador con Inno Setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.VERSION }}-cpu" `
            /DSourceDir="${{ github.workspace }}\Alfred-v${{ env.VERSION }}-cpu" `
            installer\alfred.iss
          Move-Item -Path "installer\Alfred-v${{ env.VERSION }}-cpu-win-x64-setup.exe" -Destination .

      - name: Subir archivos a la Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: v${{ env.VERSION }}
          name: Alfred v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            Alfred-v${{ env.VERSION }}-cpu-win-x64-setup.exe
            Alfred-v${{ env.VERSION }}-win-x64-cpu.zip

name: Build and Release Alfred (CUDA)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ej: 0.2.1)'
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '9.0.x'
  CUDA_VERSION: '12.4.0'

jobs:

  # ============================================================
  # Job 1: Compilar backend C++ con CUDA (Windows)
  # ============================================================
  build-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar CUDA Toolkit ${{ env.CUDA_VERSION }}
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cufft"]'

      - name: Configurar CMake (Release + CUDA)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DALFRED_CUDA=ON `
            -DALFRED_CUDA_ARCH="75;86;89"

      - name: Verificar que CUDA quedo activo en CMake
        shell: pwsh
        run: |
          $cachePath = "build/CMakeCache.txt"
          if (-not (Test-Path $cachePath)) {
            throw "No existe $cachePath despues de configurar CMake"
          }

          $cache = Get-Content $cachePath -Raw
          if ($cache -notmatch 'ALFRED_CUDA:BOOL=ON') {
            throw "ALFRED_CUDA no quedo activo en CMakeCache.txt"
          }
          if ($cache -notmatch 'GGML_CUDA:BOOL=ON') {
            throw "GGML_CUDA no quedo activo en CMakeCache.txt"
          }

          $cudaCompiler = [regex]::Match($cache, 'CMAKE_CUDA_COMPILER:FILEPATH=(.+)').Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($cudaCompiler)) {
            throw "CMAKE_CUDA_COMPILER no quedo definido en CMakeCache.txt"
          }

          Write-Host "CUDA activo en CMakeCache.txt"
          Write-Host "CMAKE_CUDA_COMPILER=$cudaCompiler"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir artifact del backend
        uses: actions/upload-artifact@v4
        with:
          name: alfred-backend
          path: |
            build/Release/alfred.exe
            build/Release/*.dll
          if-no-files-found: error

  # ============================================================
  # Job 2: Compilar frontend WinUI 3 (Windows)
  # ============================================================
  build-frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restaurar workloads necesarios
        run: dotnet workload restore --project ui/Alfred.UI/Alfred.UI.csproj

      - name: Restaurar dependencias NuGet
        run: dotnet restore ui/Alfred.UI/Alfred.UI.csproj

      - name: Compilar UI (self-contained)
        run: |
          msbuild ui/Alfred.UI/Alfred.UI.csproj `
            /restore `
            /m `
            /verbosity:minimal `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true

      - name: Copiar output completo
        run: |
          $src = "ui/Alfred.UI/bin/x64/Release/net9.0-windows10.0.19041.0/win-x64"
          New-Item -ItemType Directory -Path publish/Alfred.UI -Force
          Copy-Item -Path "$src/*" -Destination publish/Alfred.UI/ -Recurse -Force

      - name: Subir artifact del frontend
        uses: actions/upload-artifact@v4
        with:
          name: alfred-frontend
          path: publish/Alfred.UI/
          if-no-files-found: error

  # ============================================================
  # Job 3: Empaquetar y crear GitHub Release
  # ============================================================
  package-release:
    runs-on: windows-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Obtener version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
          } else {
            $tag = "${{ github.ref_name }}"
            echo "VERSION=$($tag.TrimStart('v'))" >> $env:GITHUB_ENV
          }

      - name: Descargar artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Crear estructura de distribucion
        run: |
          $dist = "Alfred-v${{ env.VERSION }}"
          New-Item -ItemType Directory -Path $dist
          Copy-Item -Path "artifacts/alfred-backend/*"  -Destination $dist -Recurse
          Copy-Item -Path "artifacts/alfred-frontend/*" -Destination $dist -Recurse
          @"
          Alfred v${{ env.VERSION }}
          ========================
          Asistente de IA local para Windows.

          Requisitos:
          - Windows 10 (19041) o superior
          - GPU NVIDIA con CUDA (RTX 20xx, 30xx o 40xx) recomendado
          - Sin GPU: usa la variante alfred-cpu

          Uso:
          1. Ejecutar Alfred.UI.exe
          2. Ir a Modelos y descargar un modelo GGUF de HuggingFace
          3. Seleccionar el modelo y empezar a chatear

          Los datos se guardan en: %APPDATA%\Alfred\
          "@ | Out-File "$dist\LEEME.txt" -Encoding UTF8

      - name: Comprimir ZIP (portable)
        run: Compress-Archive -Path "Alfred-v${{ env.VERSION }}" -DestinationPath "Alfred-v${{ env.VERSION }}-win-x64.zip"

      - name: Crear instalador con Inno Setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ env.VERSION }} `
            /DSourceDir="${{ github.workspace }}\Alfred-v${{ env.VERSION }}" `
            installer\alfred.iss
          Move-Item -Path "installer\Alfred-v${{ env.VERSION }}-win-x64-setup.exe" -Destination .

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Alfred v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            Alfred-v${{ env.VERSION }}-win-x64-setup.exe
            Alfred-v${{ env.VERSION }}-win-x64.zip
          body: |
            ## Alfred v${{ env.VERSION }}

            ### Instalacion (recomendado)
            1. Descargar `Alfred-v${{ env.VERSION }}-win-x64-setup.exe`
            2. Ejecutar el instalador
            3. Alfred se instalara en Archivos de programa y creara accesos directos

            ### Instalacion portable
            1. Descargar `Alfred-v${{ env.VERSION }}-win-x64.zip`
            2. Extraer en cualquier carpeta
            3. Ejecutar `Alfred.UI.exe`

            ### Primeros pasos
            - En la pantalla de Modelos, descargar un modelo GGUF
            - Seleccionar el modelo y empezar a chatear

            ### Requisitos
            - Windows 10 (19041+) o Windows 11
            - GPU NVIDIA (RTX 20xx/30xx/40xx) para aceleracion CUDA
            - Sin GPU: usa la variante `-cpu` de esta misma release
